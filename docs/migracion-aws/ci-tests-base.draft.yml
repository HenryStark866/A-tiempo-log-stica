# BORRADOR para el paso 0.4 — NO es un workflow activo.
#
# Cuando el paso 0.3 esté verde (los 75 tests de BD pasan en local contra
# `supabase start`), este bloque se añade a `.github/workflows/ci.yml` como un
# job nuevo, en paralelo con `verificar`. Hasta entonces no se mete: un job rojo
# desde el primer día es ruido que se aprende a ignorar (misma lógica que el
# `npm audit --high` de ci.yml).
#
# Los runners de GitHub traen Docker, así que `supabase start` funciona sin
# nada extra. El único coste es ~2-3 min de arranque de los contenedores.
#
# ── Cómo armarlo cuando toque ──────────────────────────────────────────────
#   1. Pegar el job `tests-base` de abajo dentro de `jobs:` en ci.yml.
#   2. Correrlo una vez con `workflow_dispatch` y confirmar que pasa.
#   3. Si el arranque de Supabase se pasa de los ~4 min, subir `timeout-minutes`.
#   4. Quitar este archivo.

jobs:
  tests-base:
    name: Tests contra la base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La CLI de Supabase levanta Postgres + GoTrue + PostgREST + Storage en
      # contenedores. `db reset` aplica las 106 migraciones locales desde cero:
      # si alguna no aplica en orden limpio, este paso falla y es exactamente lo
      # que queremos saber antes de migrar a AWS.
      - name: Levantar Supabase local
        run: |
          npx supabase@latest start
          npx supabase@latest db reset --no-seed

      # Las tres variables que espera tests/db/harness.ts. `supabase status -o env`
      # las imprime con los nombres del CLI; se remapean.
      - name: Exportar credenciales de la base local
        run: |
          eval "$(npx supabase@latest status -o env)"
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Tests de base
        run: npm run test:db

      - name: Apagar Supabase
        if: always()
        run: npx supabase@latest stop --no-backup
