# Verificación automática en cada cambio.
#
# Antes de esto, `npm run build` y `npm run lint` se corrían a mano, si alguien
# se acordaba, y todo commit en `main` iba a producción sin filtro. Este archivo
# es el primer filtro que no depende de que nadie se acuerde.
#
# Las variables de Supabase van con valores falsos a propósito: `src/middleware.ts`
# hace `new URL(process.env.NEXT_PUBLIC_SUPABASE_URL!)` al cargar el módulo, así
# que sin ellas el build revienta. No se conecta a nada — solo necesita que la
# cadena sea una URL válida. Las llaves de verdad viven en Vercel.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Si se empuja dos veces seguidas, la primera ejecución se cancela: interesa el
# veredicto del último commit, no el del anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: llave-falsa-solo-para-compilar

jobs:
  verificar:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice
      # package-lock.json y falla si el lock no cuadra con package.json. Sin
      # esto, CI podría pasar con dependencias distintas de las de producción.
      - name: Instalar dependencias
        run: npm ci

      # El orden importa: lo barato primero. Si los tipos no cuadran, no tiene
      # sentido esperar tres minutos al build para enterarse.
      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      # Dos pasos y no uno, y la diferencia es a propósito.
      #
      # Un check que está en rojo desde el primer día no es un check: es ruido
      # que se aprende a ignorar, y el día que llegue el fallo de verdad
      # tampoco se va a mirar. Hoy hay CUATRO avisos `high` que solo se quitan
      # subiendo a Next 16 —un cambio mayor— y que no aplican a esta app
      # (el porqué, en docs/estandares-de-plataforma.md, frente 7).
      #
      # Así que: `critical` PARA la línea, porque hoy no hay ninguno y el día
      # que aparezca uno significa algo. `high` se imprime y se ve en la
      # ejecución, pero no bloquea.
      #
      # Van ANTES del build para que no cueste tres minutos enterarse.
      - name: Ninguna dependencia con un fallo crítico
        run: npm audit --audit-level=critical

      - name: Avisos de severidad alta (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      # Sobre el build de verdad, no sobre la configuración: comprueba que no
      # se publicó ningún mapa de origen (o sea, el código fuente entero en
      # abierto) y avisa si el JavaScript de arranque engordó de golpe.
      - name: El paquete no lleva el código fuente dentro
        run: node scripts/verificar-paquete.mjs

  # ── Tests contra la base (paso 0.c de la migración a AWS) ──────────────────
  #
  # Levanta el Supabase LOCAL del runner (contenedores de Docker: Postgres +
  # GoTrue + PostgREST + Storage) y corre `npm run test:db` contra él. No usa
  # secretos de producción ni toca Supabase Cloud: las tres llaves salen de
  # `supabase status` y mueren con el runner. Corre en paralelo con `verificar`.
  #
  # Por qué hay que copiar los stubs: producción tiene objetos creados desde el
  # panel que ninguna migración crea, y la 0100 les hace REVOKE/GRANT, así que
  # sin ellos `supabase start` revienta ahí. Se copian a la carpeta de
  # migraciones DEL RUNNER (no se commitean). Las migraciones 0127-0131 los
  # reemplazan por las versiones reales de producción. Ver
  # docs/migracion-aws/staging-stubs/LEEME.md.
  tests-base:
    name: Tests contra la base (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Añadir los stubs a las migraciones del runner
        run: |
          for f in 0000_staging_stubs 01085_staging_realtime 01086_staging_trigger_evento_pedido 01087_staging_encuesta; do
            cp "docs/migracion-aws/staging-stubs/$f.sql" supabase/migrations/
          done

      # La CLI sale de package.json (versión fijada por package-lock), no de
      # `@latest`: así el CI no cambia solo cuando sale una versión nueva.
      # `start` aplica las migraciones desde cero; si alguna no aplica en orden
      # limpio, falla aquí y es justo lo que queremos saber antes de migrar.
      - name: Levantar Supabase local
        run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,postgres-meta,mailpit,supavisor

      - name: Exportar credenciales de la base local
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Tests de base
        run: npm run test:db

      # Retrato del esquema local para compararlo con el de producción
      # (62 políticas): queda en el resumen de la ejecución.
      - name: Conteo de políticas
        if: always()
        run: |
          docker exec supabase_db_a-tiempo-logistica psql -U postgres -At -c \
            "select schemaname, count(*) from pg_policies where schemaname in ('public','storage') group by 1; select 'total', count(*) from pg_policies where schemaname in ('public','storage');" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apagar Supabase
        if: always()
        run: npx supabase stop --no-backup
